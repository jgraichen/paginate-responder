# vim: ft=yaml

name: release

on:
  push:
    tags:
      - v*

jobs:
  rubygems:
    if: github.repository == 'jgraichen/paginate-responder'
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      id-token: write

    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 10
      BUNDLE_WITHOUT: development test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ruby
          # disabled to prevent runtime artifacts potentially vulnerable
          # to a cache poisoning attack
          bundler-cache: false

      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2

      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          changelog: CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
